name: Vendor LiquidGL

on:
  push:
    branches:
      - feature/v17.1.1-update-context-calc
    paths:
      - '.github/workflows/vendor-liquidgl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/v17.1.1-update-context-calc
          fetch-depth: 0

      - name: Download pinned LiquidGL v2.2.4
        run: |
          set -euo pipefail
          mkdir -p vendor/liquidgl
          PIN=60c54fd3b6b36a5734c90fbfb4f646c8391553e2
          curl -fsSL "https://raw.githubusercontent.com/naughtyduk/liquidGL/${PIN}/scripts/liquidGL.js" -o vendor/liquidgl/liquidGL.js
          curl -fsSL "https://raw.githubusercontent.com/naughtyduk/liquidGL/${PIN}/package/LICENSE" -o vendor/liquidgl/LICENSE
          printf '%s\n' 'Upstream: https://github.com/naughtyduk/liquidGL' 'Pinned version: v2.2.4' "Pinned commit: ${PIN}" > vendor/liquidgl/UPSTREAM.txt

      - name: Commit vendored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/liquidgl
          if git diff --cached --quiet; then
            echo "LiquidGL vendor files already current."
            exit 0
          fi
          git commit -m "Vendor LiquidGL v2.2.4"
          git push origin HEAD:feature/v17.1.1-update-context-calc
