<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Sidebar: All your needs in one place</title><link rel="stylesheet" href="newtab.css"></head><body>
<canvas id="stars"></canvas><div id="bg"></div><iframe id="sitebg" title="Website background"></iframe><div id="dim"></div>
<main id="dash"><button id="customize">⚙</button><section class="hero"><div id="greet"></div><div id="clock">--:--</div><div id="date"></div><form id="search"><button id="engine" type="button">G</button><input id="query" placeholder="Search the web" autofocus><button>↗</button></form></section><section id="widgets"></section></main>
<aside id="prefs"><header><div><b>Customize</b><small>Nexus new tab</small></div><button id="prefs-close">✕</button></header><div class="scroll">
<h3>General</h3><label>Name<input id="p-name"></label><label>Search<select id="p-engine"><option>google</option><option>bing</option><option>duckduckgo</option><option>brave</option><option>ecosia</option><option>startpage</option><option>custom</option></select></label><label>Custom search<input id="p-custom" placeholder="https://site/?q={q}"></label><label>24-hour<input id="p-24" type="checkbox"></label>
<h3>Background</h3><label>Type<select id="p-bgtype"><option value="stars">Infinite stars</option><option value="image">Image</option><option value="site">Website</option><option value="gradient">Gradient</option><option value="solid">Solid</option></select></label><label>Image URL<input id="p-bgurl"></label><label>Upload<input id="p-file" type="file" accept="image/*"></label><label>Website<input id="p-site" placeholder="https://example.com"></label><label>Star speed<input id="p-speed" type="range" min="0" max="200"></label><label>Star density<input id="p-density" type="range" min="30" max="180"></label><label>Star brightness<input id="p-bright" type="range" min="30" max="180"></label><label>Solid<input id="p-solid" type="color"></label><label>Gradient A<input id="p-ga" type="color"></label><label>Gradient B<input id="p-gb" type="color"></label><label>Dim<input id="p-dim" type="range" min="0" max="80"></label>
<h3>Appearance</h3><label>Accent<input id="p-accent" type="color"></label><label>Glass opacity<input id="p-opacity" type="range" min="10" max="95"></label><label>Blur<input id="p-blur" type="range" min="0" max="40"></label><label>Radius<input id="p-radius" type="range" min="0" max="40"></label><label>Columns<input id="p-cols" type="range" min="1" max="4"></label>
<h3>Widgets</h3><label>Weather<input id="w-weather" type="checkbox"></label><label>Quote<input id="w-quote" type="checkbox"></label><label>Focus timer<input id="w-focus" type="checkbox"></label><label>Quick links<input id="w-links" type="checkbox"></label><label>Weather location<input id="p-weather"></label><label class="stack">Quick links<textarea id="p-links" rows="6" placeholder="GitHub | https://github.com"></textarea></label>
<h3>Advanced</h3><label class="stack">Custom CSS<textarea id="p-css" rows="8"></textarea></label><button id="reset">Reset dashboard</button>
</div></aside><style id="custom-css"></style><script src="newtab.js"></script></body></html>
