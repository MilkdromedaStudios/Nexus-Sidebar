<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus Workspace</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="newtab-polish.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="bg" aria-hidden="true"></div>
  <div id="dim" aria-hidden="true"></div>

  <main id="dash">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">N</span>
        <div><b>Nexus</b><small id="date">Today</small></div>
      </div>
      <button id="customize" title="Customize workspace" aria-label="Customize workspace">⚙</button>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <div id="greet">Good day</div>
        <div id="clock">--:--</div>
        <p>One clear next step is enough to start.</p>
      </div>
      <form id="search" autocomplete="off">
        <button id="engine" type="button" title="Change search engine">G</button>
        <input id="query" placeholder="Search the web or enter a URL" aria-label="Search the web" autofocus>
        <button class="go" title="Search">↗</button>
      </form>
    </section>

    <form id="quick-task" class="quick-capture" autocomplete="off">
      <span>＋</span>
      <input id="quick-task-input" placeholder="Add something you want to get done today…" aria-label="Add a task">
      <button>Add</button>
    </form>

    <section id="widgets" aria-label="Productivity widgets"></section>
  </main>

  <aside id="prefs" aria-label="Customize Nexus">
    <header>
      <div><b>Customize</b><small>Nexus workspace</small></div>
      <button id="prefs-close" aria-label="Close settings">✕</button>
    </header>
    <div class="scroll">
      <h3>General</h3>
      <label>Name<input id="p-name"></label>
      <label>Search<select id="p-engine"><option>google</option><option>bing</option><option>duckduckgo</option><option>brave</option><option>ecosia</option><option>startpage</option><option>custom</option></select></label>
      <label>Custom search<input id="p-custom" placeholder="https://site/?q={q}"></label>
      <label>24-hour clock<input id="p-24" type="checkbox"></label>

      <h3>Background</h3>
      <label>Type<select id="p-bgtype"><option value="gradient">Gradient</option><option value="stars">Stars</option><option value="image">Image</option><option value="solid">Solid</option></select></label>
      <label>Image URL<input id="p-bgurl"></label>
      <label>Upload<input id="p-file" type="file" accept="image/*"></label>
      <label>Star speed<input id="p-speed" type="range" min="0" max="160"></label>
      <label>Star density<input id="p-density" type="range" min="30" max="160"></label>
      <label>Star brightness<input id="p-bright" type="range" min="30" max="160"></label>
      <label>Solid<input id="p-solid" type="color"></label>
      <label>Gradient A<input id="p-ga" type="color"></label>
      <label>Gradient B<input id="p-gb" type="color"></label>
      <label>Dim<input id="p-dim" type="range" min="0" max="80"></label>

      <h3>Appearance</h3>
      <label>Accent<input id="p-accent" type="color"></label>
      <label>Glass opacity<input id="p-opacity" type="range" min="10" max="95"></label>
      <label>Blur<input id="p-blur" type="range" min="0" max="40"></label>
      <label>Radius<input id="p-radius" type="range" min="4" max="28"></label>
      <label>Columns<input id="p-cols" type="range" min="1" max="4"></label>

      <h3>Widgets</h3>
      <label>Tasks<input id="w-tasks" type="checkbox"></label>
      <label>Focus timer<input id="w-focus" type="checkbox"></label>
      <label>Notes<input id="w-notes" type="checkbox"></label>
      <label>Quick links<input id="w-links" type="checkbox"></label>
      <label>Weather<input id="w-weather" type="checkbox"></label>
      <label>Quote<input id="w-quote" type="checkbox"></label>
      <label>Weather location<input id="p-weather"></label>
      <label class="stack">Quick links<textarea id="p-links" rows="6" placeholder="GitHub | https://github.com"></textarea></label>

      <h3>Advanced</h3>
      <label class="stack">Custom CSS<textarea id="p-css" rows="8"></textarea></label>
      <button id="reset">Reset workspace</button>
    </div>
  </aside>

  <style id="custom-css"></style>
  <script src="newtab.js"></script>
</body>
</html>
